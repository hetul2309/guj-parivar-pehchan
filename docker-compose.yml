services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: family_id_postgis
    environment:
      POSTGRES_USER: family_id_user
      POSTGRES_PASSWORD: family_id_password
      POSTGRES_DB: family_id_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_id_user -d family_id_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
